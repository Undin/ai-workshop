<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skill Atlas</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header>
    <h1>Skill Atlas</h1>
    <form id="scan" role="search">
      <label for="source">Repository</label>
      <input id="source" name="source" type="text" placeholder="https://github.com/owner/repo, https://github.com/owner or a directory" autocomplete="off" spellcheck="false">
      <button type="submit">Scan</button>
    </form>
  </header>
  <p id="progress" aria-label="Progress" hidden>Scanning <a id="progress-organization"></a><span id="progress-count"></span> <button id="stop" type="button">Stop</button></p>
  <p id="status" role="status" hidden></p>
  <main hidden>
    <nav aria-labelledby="repository">
      <h2 id="repository"></h2>
      <ul id="warnings" aria-label="Warnings"></ul>
      <div id="filtering">
        <label for="filter">Filter</label>
        <input id="filter" type="search" placeholder="A name or a description" autocomplete="off" spellcheck="false">
        <p id="shown" aria-live="polite"></p>
      </div>
      <ul id="skills" aria-label="Skills"></ul>
    </nav>
    <article id="skill" aria-labelledby="skill-name" hidden>
      <div id="skill-title">
        <h2 id="skill-name"></h2>
        <p id="skill-updated"></p>
      </div>
      <p id="skill-location"></p>
      <p id="skill-copies"></p>
      <table id="front-matter" aria-label="Front matter"><tbody></tbody></table>
      <div id="skill-body"></div>
    </article>
  </main>
  <section id="organization" aria-labelledby="organization-name" hidden>
    <h2 id="organization-name"></h2>
    <ul id="organization-warnings" aria-label="Warnings"></ul>
    <ul id="repositories" aria-label="Repositories"></ul>
  </section>
</body>
</html>
