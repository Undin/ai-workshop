# The demos of the web view (demos/*.demo.ts), all of them, by hand only, apart from CI (ci.yml):
#   gh workflow run Demos --ref <branch>
# Each one recorded on real repositories, its video an artifact of its own, `<name>.webm`, and the
# screenshots of its key points another, `<name>-screenshots`, to look at. Not on pull requests: their
# scans share the runners' limit on GitHub's code search, and too often get 429 (#27).
# A demo asserts what it shows: a red run is a demo or a feature that broke, or that 429.
name: Demos
run-name: "Demos on ${{ github.head_ref || github.ref_name }}"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: demos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Every demo: their names, for the job below.
  demo-list:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          names=$(ls demos/*.demo.ts | xargs -n1 basename | sed 's/\.demo\.ts$//')
          echo "names=$(printf '%s\n' $names | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
  # Each demo, on real repositories as `npm run demo` does, its video an artifact of its own,
  # `<name>.webm`, to link from the pull request's description.
  demo:
    needs: demo-list
    if: needs.demo-list.outputs.names != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.demo-list.outputs.names) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # For the waits a demo plays faster (faster() in demos/demo.ts).
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      # A real scan can hit GitHub's rate limit (429), shared by the runners: up to 3 attempts, a minute
      # apart, each one recording the demo and its key points anew.
      - id: demo
        run: |
          for attempt in 1 2 3; do
            npm run demo -- "$NAME.demo.ts" && exit 0
            [ "$attempt" = 3 ] || { echo "::warning::Demo $NAME failed (attempt $attempt), retrying in 60 s"; sleep 60; }
          done
          exit 1
        env:
          NAME: ${{ matrix.name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Even when the demo failed, so that it shows where; not when it never ran.
      - uses: actions/upload-artifact@v7
        if: always() && steps.demo.outcome != 'skipped'
        with:
          path: demos/out/${{ matrix.name }}.webm
          archive: false
          if-no-files-found: error
          retention-days: 90
      # The screenshots of its key points, demos/out/<name>/<nn>-<point>.png, as far as it got.
      - uses: actions/upload-artifact@v7
        if: always() && steps.demo.outcome != 'skipped'
        with:
          name: ${{ matrix.name }}-screenshots
          path: demos/out/${{ matrix.name }}/
          if-no-files-found: warn
          retention-days: 90
