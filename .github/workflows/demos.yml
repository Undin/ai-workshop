# The demos of the web view (demos/<name>/<name>.demo.ts), all of them, on every pull request, and
# by hand (gh workflow run Demos --ref <branch>). GitHub answers each one from its recording,
# demos/<name>/cache/: no network, no token, no 429 (#27). Its video an artifact of its own,
# `<name>.webm`, and the screenshots of its key points another, `<name>-screenshots`, to look at.
# A demo asserts what it shows: a red run is a demo or a feature that broke, or a request the
# recording does not have (npm run demo:record -- <name>).
name: Demos
run-name: "Demos on ${{ github.head_ref || github.ref_name }}"
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: demos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Every demo: their names, for the job below.
  demo-list:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          names=$(ls demos/*/*.demo.ts | xargs -n1 dirname | xargs -n1 basename)
          echo "names=$(printf '%s\n' $names | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
  # Each demo, as `npm run demo` runs it, its video an artifact of its own, `<name>.webm`.
  demo:
    needs: demo-list
    if: needs.demo-list.outputs.names != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.demo-list.outputs.names) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # For the waits a demo plays faster (faster() in demos/demo.ts).
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - id: demo
        run: npm run demo -- "demos/$NAME/"
        env:
          NAME: ${{ matrix.name }}
      # Even when the demo failed, so that it shows where; not when it never ran.
      - uses: actions/upload-artifact@v7
        if: always() && steps.demo.outcome != 'skipped'
        with:
          path: demos/out/${{ matrix.name }}.webm
          archive: false
          if-no-files-found: error
          retention-days: 90
      # The screenshots of its key points, demos/<name>/screenshots/<nn>-<point>.png, as far as it got.
      - uses: actions/upload-artifact@v7
        if: always() && steps.demo.outcome != 'skipped'
        with:
          name: ${{ matrix.name }}-screenshots
          path: demos/${{ matrix.name }}/screenshots/
          if-no-files-found: warn
          retention-days: 90
